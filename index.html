<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f071e">
<meta name="description" content="Lectures and sections schedule - Cyber-Security - Second Year - Helwan International Technological University">
<title>El Brens Cyber - Second Year Schedule 2026/2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{
  --bg-dark:#0f071e; --bg-card:#180c2e;
  --purple:#8a2be2; --purple-light:#9d4edd;
  --blue:#48cae4; --blue-glow:rgba(72,202,228,.4);
  --text:#f8f9fa; --muted:#b1a7d8; --pink:#f72585;
  --border:rgba(138,43,226,.3);
  --lecture:#ff4d4d; --section:#2ecc71;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Cairo',sans-serif}
body{
  background:var(--bg-dark);color:var(--text);min-height:100vh;overflow-x:hidden;
  background-image:radial-gradient(circle at 10% 20%,rgba(138,43,226,.15),transparent 40%),
                   radial-gradient(circle at 90% 80%,rgba(72,202,228,.15),transparent 40%);
  background-attachment:fixed;
}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

header{
  background:linear-gradient(135deg,#180c2e,#241147);
  border-bottom:2px solid var(--purple);padding:20px 15px;text-align:center;
  box-shadow:0 10px 30px rgba(0,0,0,.5);
}
.header-row{flex-direction:row-reverse;display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:900px;margin:0 auto}
.header-content{flex:1;display:flex;flex-direction:column;align-items:center;gap:10px;min-width:0}
.side-logo{flex:0 0 auto;width:84px;height:84px;border-radius:50%;background:#fff;padding:4px;object-fit:contain;
  border:2px solid var(--blue);box-shadow:0 0 18px var(--blue-glow),0 4px 14px rgba(0,0,0,.5);transition:transform .3s}
.side-logo:hover{transform:scale(1.08) rotate(-3deg)}
.brand{font-family:'Orbitron','Cairo',sans-serif;font-weight:900;font-size:2rem;letter-spacing:4px;direction:ltr;line-height:1.1;
  background:linear-gradient(90deg,#f72585,#b5179e,#8a2be2,#48cae4,#4ade80,#f72585);background-size:300% 100%;
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  animation:shine 6s linear infinite;filter:drop-shadow(0 0 10px rgba(138,43,226,.7))}
@keyframes shine{to{background-position:300% 0}}
.logo{position:relative;width:88px;height:88px;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 50% 45%,#1b1147 0%,#0b0620 75%);border-radius:50%;overflow:visible;
  box-shadow:0 0 30px var(--blue-glow),inset 0 0 18px rgba(72,202,228,.35);animation:pulse 4s infinite alternate}
.logo svg{position:absolute;inset:3px;width:calc(100% - 6px);height:calc(100% - 6px);animation:atomspin 14s linear infinite,hue 7s linear infinite;filter:drop-shadow(0 0 3px rgba(72,202,228,.8))}
@keyframes atomspin{to{transform:rotate(360deg)}}
@keyframes hue{to{filter:drop-shadow(0 0 3px rgba(72,202,228,.8)) hue-rotate(360deg)}}
.logo-ring{position:absolute;width:104px;height:104px;border:2px dashed var(--blue);border-radius:50%;animation:spin 8s linear infinite}
.logo-text{font-family:'Orbitron','Cairo',sans-serif;font-size:1.55rem;font-weight:900;z-index:2;letter-spacing:1px;
  background:linear-gradient(90deg,#f72585,#ffd60a,#4ade80,#48cae4,#b388ff,#f72585);background-size:300% 100%;
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:shine 3s linear infinite;
  filter:drop-shadow(0 0 4px rgba(0,0,0,.95)) drop-shadow(0 0 6px rgba(255,255,255,.35))}
@keyframes pulse{from{transform:scale(1);filter:hue-rotate(0)}to{transform:scale(1.06);filter:hue-rotate(35deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
h1{font-size:1.3rem;font-weight:700;background:linear-gradient(90deg,#fff,var(--blue));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.subtitle{font-size:.9rem;color:var(--muted)}
.print-sec{display:none}
.saved{font-size:.78rem;color:#4ade80;min-height:1.1em}

.actions-bar{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin:15px auto;max-width:900px;padding:0 15px}
.btn{background:linear-gradient(135deg,var(--purple),var(--purple-light));color:#fff;border:none;padding:10px 18px;border-radius:12px;
  font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:8px;box-shadow:0 4px 15px rgba(138,43,226,.4);
  transition:transform .25s,box-shadow .25s,filter .25s;text-decoration:none;font-size:.9rem}
.btn:hover{transform:translateY(-3px);box-shadow:0 6px 20px var(--blue-glow);filter:brightness(1.1)}
.btn-wa{background:linear-gradient(135deg,#25d366,#128c7e);box-shadow:0 4px 15px rgba(37,211,102,.4)}
.btn-portal{background:linear-gradient(135deg,#48cae4,#0077b6);box-shadow:0 4px 15px rgba(72,202,228,.4)}
.btn-pdf{background:linear-gradient(135deg,#ff6b6b,#d62839);box-shadow:0 4px 15px rgba(214,40,57,.4)}
.btn-sm{font-size:.78rem;padding:6px 10px;border-radius:8px;box-shadow:none}
.btn-platform{background:linear-gradient(135deg,#f72585,#b5179e)}
.btn-cal{background:linear-gradient(135deg,#4285F4,#34A853)}

.panel{max-width:950px;margin:15px auto;padding:15px;background:rgba(24,12,46,.85);border-radius:16px;
  border:1px solid var(--border);display:flex;flex-direction:column;gap:12px;width:calc(100% - 30px)}
.panel h2{font-size:.9rem;color:var(--muted);font-weight:600}
.panel h2 i{color:var(--blue)}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:8px}
.chip{background:var(--bg-card);color:var(--text);border:1px solid var(--border);padding:9px 0;border-radius:10px;
  font-size:.95rem;font-weight:700;cursor:pointer;transition:.2s;text-align:center}
.chip:hover{border-color:var(--blue)}
.chip.active{background:linear-gradient(135deg,var(--purple),var(--purple-light));border-color:var(--blue);box-shadow:0 0 12px var(--blue-glow)}
.chip.all{grid-column:span 2;font-size:.85rem}
.search{position:relative}
.search input{width:100%;background:rgba(255,255,255,.07);border:1px solid var(--border);padding:12px 45px 12px 40px;
  border-radius:12px;color:#fff;font-size:.95rem;outline:none;transition:.3s}
.search input:focus{border-color:var(--blue);box-shadow:0 0 15px var(--blue-glow)}
.search i.s{position:absolute;right:15px;top:50%;transform:translateY(-50%);color:var(--blue)}
.search button{position:absolute;left:10px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--muted);cursor:pointer;font-size:1rem;display:none}
.search.has-text button{display:block}
.filters{display:flex;flex-wrap:wrap;gap:12px}
.field{flex:1;min-width:200px;display:flex;flex-direction:column;gap:5px}
.field label{font-size:.85rem;color:var(--muted);font-weight:600}
.field select{background:var(--bg-card);color:#fff;border:1px solid var(--border);padding:10px;border-radius:10px;font-size:.9rem;cursor:pointer}
.weeks{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.week-btn{background:var(--bg-card);color:var(--muted);border:1px solid var(--border);padding:6px 16px;border-radius:8px;font-size:.85rem;font-weight:600;cursor:pointer;transition:.2s}
.week-btn.active{background:var(--purple);color:#fff;border-color:var(--blue);box-shadow:0 0 10px var(--blue-glow)}
.panel-foot{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;font-size:.8rem;color:var(--muted)}
.link-btn{background:none;border:none;color:var(--blue);cursor:pointer;font-weight:600;font-size:.8rem}

.next{max-width:950px;margin:0 auto 15px;width:calc(100% - 30px);padding:12px 16px;border-radius:14px;
  background:linear-gradient(90deg,rgba(72,202,228,.18),rgba(138,43,226,.18));border:1px solid var(--blue);
  display:none;gap:10px;align-items:center;font-size:.92rem}
.next.show{display:flex}
.next i{color:var(--blue);font-size:1.2rem}

.container{max-width:950px;margin:0 auto 40px;padding:0 15px}
.day-card{background:var(--bg-card);border-radius:16px;border:1px solid var(--border);margin-bottom:25px;
  box-shadow:0 8px 32px rgba(0,0,0,.4);overflow:hidden;animation:fade .4s ease}
.day-card.today{border-color:var(--blue);box-shadow:0 8px 32px rgba(0,0,0,.4),0 0 18px var(--blue-glow)}
.day-header{background:linear-gradient(90deg,rgba(138,43,226,.3),rgba(72,202,228,.1));padding:15px 20px;font-size:1.2rem;font-weight:700;
  color:var(--blue);border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.day-header .tags{display:flex;gap:6px}
.day-header span.tag{font-size:.8rem;background:var(--purple);color:#fff;padding:3px 10px;border-radius:20px}
.day-header span.tag.now{background:var(--blue);color:#06202a;font-weight:700}
.list{padding:15px;display:flex;flex-direction:column;gap:12px}
.item{background:rgba(255,255,255,.03);padding:12px 15px;border-radius:8px;display:flex;flex-direction:column;gap:6px;
  transition:background .2s;border-inline-start:5px solid var(--lecture)}
.item.section{border-inline-start-color:var(--section)}
.item:hover{background:rgba(138,43,226,.1)}
.item.ongoing{background:rgba(72,202,228,.12);box-shadow:inset 0 0 0 1px var(--blue)}
.time{font-size:.8rem;color:var(--blue);font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.period{background:rgba(138,43,226,.25);color:#d8b4fe;padding:2px 8px;border-radius:6px;font-size:.75rem;border:1px solid var(--border)}
.title{font-size:1rem;font-weight:700}
.details{font-size:.85rem;color:var(--muted);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-top:4px}
.badges{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.badge{padding:2px 8px;border-radius:4px;font-size:.75rem;font-weight:600;border:1px solid transparent}
.b-sec{background:rgba(247,37,133,.2);color:var(--pink);border-color:rgba(247,37,133,.4)}
.b-w1{background:rgba(247,37,133,.25);color:#ff477e;border-color:rgba(247,37,133,.5);font-weight:700}
.b-w2{background:rgba(72,202,228,.25);color:var(--blue);border-color:rgba(72,202,228,.5);font-weight:700}
.b-room{background:rgba(72,202,228,.15);color:var(--blue)}
.b-lec{background:rgba(255,77,77,.2);color:#ff7b7b;border-color:rgba(255,77,77,.5)}
.b-lab{background:rgba(46,204,113,.2);color:#4ade80;border-color:rgba(46,204,113,.5)}
.b-now{background:var(--blue);color:#06202a;font-weight:700}
.buttons{display:flex;gap:6px;flex-wrap:wrap}
.day-off,.empty,.prompt{padding:20px;text-align:center;color:var(--muted);font-style:italic}
.empty,.prompt{display:none;background:var(--bg-card);border:1px dashed var(--border);border-radius:16px}
.empty.show,.prompt.show{display:block}
.prompt{font-style:normal;font-size:1.05rem}
.prompt i{color:var(--blue);font-size:1.6rem;display:block;margin-bottom:8px}
.legend{display:flex;gap:16px;justify-content:center;font-size:.8rem;color:var(--muted);margin-bottom:15px;flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-inline-end:6px;vertical-align:middle}
.modal{position:fixed;inset:0;z-index:100;background:rgba(5,2,15,.94);display:flex;flex-direction:column}
.modal[hidden]{display:none}
.modal-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:10px 14px;
  background:linear-gradient(135deg,#180c2e,#241147);border-bottom:2px solid var(--purple)}
.modal-bar strong{font-size:.95rem}
.modal-actions .btn{font-weight:900}
.modal-actions{display:flex;gap:8px;flex-wrap:wrap}
.modal-actions .btn,.modal-actions button.btn{padding:7px 12px;font-size:.82rem;border-radius:9px;box-shadow:none}
.modal-body{flex:1;overflow:auto;padding:10px;touch-action:pan-x pan-y pinch-zoom;-webkit-overflow-scrolling:touch}
.modal-body img{display:block;margin:0 auto;width:calc(var(--z,100)*1%);max-width:none;background:#fff;border-radius:6px}
footer{text-align:center;padding:20px;color:var(--muted);font-size:.85rem;border-top:1px solid var(--border);margin-top:30px}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:520px){.buttons{width:100%}.btn-sm{flex:1;justify-content:center}.side-logo{width:56px;height:56px}.brand{font-size:1.25rem;letter-spacing:2px}h1{font-size:1.05rem}.subtitle{font-size:.78rem}.logo{width:76px;height:76px}.logo-ring{width:90px;height:90px}}
@media print{
  body{background:#fff;color:#000}
  .modal,header .logo,.brand,.actions-bar,.panel,.next,footer,.btn-sm,.legend,.prompt,.empty{display:none!important}
  header{background:none;box-shadow:none;border-bottom:1px solid #999}
  h1{-webkit-text-fill-color:#000;color:#000}.subtitle{color:#333}
  .print-sec{display:block;font-weight:700;color:#000;font-size:1.1rem}
  .day-card{border:1px solid #ccc;box-shadow:none;break-inside:avoid;background:#fff;animation:none}
  .day-header{background:#eee;color:#000}
  .item{background:#f9f9f9;border-inline-start-color:#333!important}
  .title{color:#000}.time,.badge,.period,.details{color:#333!important;background:none!important}
}
</style>
</head>
